name = "portfolio-contact"
main = "src/index.js"
compatibility_date = "2026-08-27"
workers_dev = true
preview_urls = false

# Local: `npx wrangler dev --env local` plus gitignored `.dev.vars`.
# STUB_RESEND=1 skips Resend — local Turnstile success is not a real inbox test.
# Production acceptance is a manual submit from https://hiteshgoyal.me only.

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://hiteshgoyal.me"

[secrets]
required = ["RESEND_API_KEY", "TURNSTILE_SECRET_KEY", "CONTACT_TO_EMAIL"]

[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "459901"

  [ratelimits.simple]
  limit = 5
  period = 60

[env.local]
vars = { ALLOWED_ORIGINS = "http://127.0.0.1:8766,http://localhost:8766,http://0.0.0.0:8766,http://127.0.0.1:8000,http://localhost:8000", STUB_RESEND = "1" }

[env.local.secrets]
required = ["RESEND_API_KEY", "TURNSTILE_SECRET_KEY", "CONTACT_TO_EMAIL"]

[[env.local.ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "459901"

  [env.local.ratelimits.simple]
  limit = 5
  period = 60
